name: beatdrop

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-beatdrop}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-beatdrop_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-beatdrop} -d ${DATABASE_NAME:-beatdrop_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --port 6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-beatdrop_production}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-beatdrop}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_SESSION_STORE_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/1
      SENTRY_DSN: ${SENTRY_DSN:-}
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}
      APP_HOST: ${APP_HOST:-blindjam.com}
      # Google Stitch / anonymous crawl: set STITCH_PUBLIC_PREVIEW=true in .env, then set false or remove after.
      STITCH_PUBLIC_PREVIEW: ${STITCH_PUBLIC_PREVIEW:-false}
      FORCE_SSL: ${FORCE_SSL:-true}
      PORT: "3000"
      WEB_CONCURRENCY: "2"
    volumes:
      - rails_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - glitchtip-web

  # GlitchTip - self-hosted error tracking (Sentry-compatible)
  glitchtip-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GLITCHTIP_DB_USER:-glitchtip}
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD}
      POSTGRES_DB: ${GLITCHTIP_DB_NAME:-glitchtip}
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GLITCHTIP_DB_USER:-glitchtip} -d ${GLITCHTIP_DB_NAME:-glitchtip}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  glitchtip-web:
    image: glitchtip/glitchtip:6
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${GLITCHTIP_DB_USER:-glitchtip}:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/${GLITCHTIP_DB_NAME:-glitchtip}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: https://errors.blindjam.com
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@blindjam.com}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      SERVER_ROLE: all_in_one
      ALLOWED_HOSTS: "errors.blindjam.com,localhost"
      CSRF_TRUSTED_ORIGINS: "https://errors.blindjam.com"
    volumes:
      - glitchtip_uploads:/code/uploads
    depends_on:
      glitchtip-db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rails_storage:
  caddy_data:
  caddy_config:
  glitchtip_postgres_data:
  glitchtip_uploads:
