en:
  controllers:
    global:
      create:
        success: Successfully created.
        failure: Could not create. Please check the errors below.
      update:
        success: Successfully updated.
        failure: Could not update. Please check the errors below.
      destroy:
        success: Successfully deleted.
        failure: Could not delete.

    dev_sessions:
      create:
        sign_in_notice: "Signed in as %{user} (Development Mode)"
      dev_login_only_available_in_development: Dev login is only available in development

    rooms:
      show:
        page_title: "Live Room %{code}"
      new:
        page_title: "Create Live Room"
        title: "Create a Live Room"
        description: "Start a party session. Share the room code with players so everyone sees the same track."
        back: "Back"
      create:
        success: "Room created! Share the code with players."
        submit: "Create room"
      play_track_actions:
        new:
          page_title: "Play track in room"
          title: "Play a track in this room"
          description: "Paste a track token from a QR code, or enter deck position."
          track_token_label: "Track token (from QR)"
          deck_id_label: "Deck ID"
          position_label: "Position"
          back: "Back to room"
        create:
          success: "Track is now playing for everyone."
          submit: "Play track"
      reveal_actions:
        create:
          success: "Track revealed!"
      next_actions:
        create:
          success: "Next track."
      join_actions:
        new:
          page_title: "Join room"
          title: "Join the game"
          description: "Enter your name to join this room. The host will share the code."
          name_label: "Your name"
          name_placeholder: "e.g. Alex"
          submit: "Join"
          back: "Back"
          default_name: "Player"
        create:
          success: "You're in! Have fun."
          already_joined: "You're already in this room."

    games:
      create:
        success: Game started! Good luck!
        failure: Could not start game.
      next_track:
        completed: Game completed! Well done!
      reveal:
        success: Track revealed!
      abandon:
        success: Game abandoned.

    playlists:
      create:
        success: Playlist created.
        success_importing: Playlist created! Import started...
        failure: Could not create playlist.
      destroy:
        success: Playlist deleted.
        failure: Could not delete playlist.
      import:
        success: Re-import started...
        failure: Could not start re-import.
    # Admin controllers
    admin:
      roles:
        create:
          success: Role created successfully.
          failure: Could not create role.
        update:
          success: Role updated successfully.
          failure: Could not update role.
        destroy:
          success: Role deleted successfully.
          cannot_delete: Cannot delete role that has users assigned.

      users:
        update:
          success: User updated successfully.
          failure: Could not update user.
        destroy:
          success: User deleted successfully.
          failure: Could not delete user.

      settings:
        update:
          success: Setting updated successfully.
          failure: Could not update setting.

      classification_values:
        create:
          success: Value created successfully.
          failure: Could not create value.
        update:
          success: Value updated successfully.
          failure: Could not update value.

      playlists:
        generate_qr_codes:
          success: QR code generation started.
          cannot_generate: Cannot generate QR codes for this playlist.
        download_cards:
          not_generated: QR codes have not been generated yet.
          file_not_found: PDF file not found. Please regenerate QR codes.
        release_years_actions:
          update:
            success: Release years updated.

      tracks:
        played_in_room: Track playing in room.
        qr_code:
          not_generated: QR code not generated for this track.

      aruco_decks:
        create:
          success: ArUco deck created successfully.
        assign_playlist:
          success: Deck slots updated to use the selected playlist.
          playlist_not_found: Playlist not found.
          playlist_required: Please select a playlist.
        generate_qr_codes:
          started: QR card generation started.
          cannot_generate: Cannot generate QR cards — no slots assigned yet.
        download_cards:
          not_generated: QR cards have not been generated yet.
